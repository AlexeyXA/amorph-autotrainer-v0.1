[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amorph-autotrainer"
version = "0.1.0"
description = "Budget-aware, reproducible AutoTrainer MVP for classification and feature extraction"
readme = "README_RU.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AMORPH project"}]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "joblib>=1.3",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
test = ["pytest>=8.0"]

[project.scripts]
amorph-autotrainer = "amorph_autotrainer.cli:main"

[tool.setuptools.packages.find]
include = ["amorph_autotrainer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
