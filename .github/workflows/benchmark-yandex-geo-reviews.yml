name: Yandex geo-reviews rating benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/benchmark_yandex_geo_reviews.py"
      - "tests/test_yandex_geo_reviews.py"
      - ".github/workflows/benchmark-yandex-geo-reviews.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yandex-review-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0"
          python -m pip install -e ".[test,embeddings]" pandas pyarrow huggingface_hub
      - name: Run unit tests for data hygiene
        run: python -m pytest -q tests/test_yandex_geo_reviews.py
      - name: Record execution start
        id: clock
        run: |
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "started_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Run group-disjoint Yandex review benchmark
        run: |
          python scripts/benchmark_yandex_geo_reviews.py \
            --output-dir benchmark_runs/yandex_geo_reviews \
            --max-runtime-seconds 7200
      - name: Record workflow provenance and summary
        if: always()
        env:
          STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
          STARTED_UTC: ${{ steps.clock.outputs.started_utc }}
          SOURCE_COMMIT: ${{ github.sha }}
          ACTIONS_RUN_ID: ${{ github.run_id }}
          ACTIONS_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib, json, os, time
          from datetime import datetime, timezone
          from pathlib import Path
          out = Path("benchmark_runs/yandex_geo_reviews")
          out.mkdir(parents=True, exist_ok=True)
          result_path = out / "benchmark_result.json"
          provenance_path = out / "dataset_provenance.json"
          result = json.loads(result_path.read_text(encoding="utf-8")) if result_path.is_file() else {}
          provenance = json.loads(provenance_path.read_text(encoding="utf-8")) if provenance_path.is_file() else {}
          started = int(os.environ.get("STARTED_EPOCH") or time.time())
          files = []
          for path in sorted(out.rglob("*.json")):
              if path.name == "execution_manifest.json":
                  continue
              files.append({"path": path.relative_to(out).as_posix(),
                            "size_bytes": path.stat().st_size,
                            "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
          manifest = {
              "status": "result_written" if result_path.is_file() else "incomplete_or_failed",
              "source_commit": os.environ.get("SOURCE_COMMIT"),
              "workflow_run_id": os.environ.get("ACTIONS_RUN_ID"),
              "workflow_run_attempt": os.environ.get("ACTIONS_RUN_ATTEMPT"),
              "started_at_utc": os.environ.get("STARTED_UTC"),
              "finished_at_utc": datetime.now(timezone.utc).isoformat(),
              "elapsed_seconds": max(0, int(time.time()) - started),
              "dataset_id": provenance.get("dataset_id"),
              "dataset_revision": provenance.get("dataset_revision"),
              "source_file_sha256": provenance.get("source_file_sha256"),
              "prepared_file_sha256": provenance.get("prepared_file_sha256"),
              "selected_strategy": result.get("selected_strategy"),
              "internal_run_status": result.get("internal_run_status"),
              "files_sha256": files,
              "note": "Raw review CSV and model files are intentionally not uploaded.",
          }
          (out / "execution_manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("# Yandex Geo Reviews rating benchmark\n\n")
              for key in ("status", "source_commit", "dataset_revision", "elapsed_seconds", "selected_strategy"):
                  handle.write("- " + key + ": " + str(manifest.get(key)) + "\n")
              if result:
                  handle.write("- Internal run status: " + str(result.get("internal_run_status")) + "\n")
                  handle.write("- Proof Gate verdict: " + str((result.get("proofgate") or {}).get("selected_candidate_verdict")) + "\n")
                  handle.write("\nValidation metrics:\n\n")
                  handle.write(json.dumps(result.get("validation_metrics"), indent=2, ensure_ascii=False) + "\n")
              else:
                  handle.write("\nNo benchmark_result.json was produced; inspect the failed step logs.\n")
          PY
      - name: Upload metadata-only benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amorph-yandex-reviews-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark_runs/yandex_geo_reviews/dataset_provenance.json
            benchmark_runs/yandex_geo_reviews/benchmark_result.json
            benchmark_runs/yandex_geo_reviews/execution_manifest.json
            benchmark_runs/yandex_geo_reviews/runs/*/report.json
            benchmark_runs/yandex_geo_reviews/runs/*/manifest.json
            benchmark_runs/yandex_geo_reviews/runs/*/data_report.json
            benchmark_runs/yandex_geo_reviews/runs/*/replay.json
            benchmark_runs/yandex_geo_reviews/runs/*/proofgate/*.json
            benchmark_runs/yandex_geo_reviews/runs/*/selected/manifest.json
            benchmark_runs/yandex_geo_reviews/runs/*/selected/data_report.json
            benchmark_runs/yandex_geo_reviews/runs/*/selected/replay.json
            benchmark_runs/yandex_geo_reviews/runs/*/selected/proofgate/*.json
            benchmark_runs/yandex_geo_reviews/runs/*/candidates/*/validation_metrics.json
            benchmark_runs/yandex_geo_reviews/runs/*/candidates/*/strategy.json
          if-no-files-found: warn
          retention-days: 30
