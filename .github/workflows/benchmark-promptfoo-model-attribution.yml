name: Benchmark Promptfoo grouped model attribution

on:
  push:
    branches:
      - research/real-task-verification-20261024
    paths:
      - "scripts/prepare_promptfoo_model_report_dataset.py"
      - ".github/workflows/benchmark-promptfoo-model-attribution.yml"
      - "amorph_autotrainer/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grouped-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout pinned source revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install AMORPH with CPU embeddings and data readers
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0"
          python -m pip install -e ".[test,embeddings]" "datasets==3.3.2" pandas pyarrow huggingface_hub requests
      - name: Run unit tests
        run: |
          python -m pytest
          python -m compileall -q amorph_autotrainer scripts
      - name: Prepare pinned Promptfoo dataset
        run: |
          python scripts/prepare_promptfoo_model_report_dataset.py \
            --output-dir benchmark_runs/promptfoo \
            --cache-dir .cache/promptfoo
      - name: Run AMORPH with grouped split by question_id
        id: benchmark
        continue-on-error: true
        run: |
          mkdir -p benchmark_runs/promptfoo-attribution
          set +e
          amorph-autotrainer train \
            benchmark_runs/promptfoo/model_response_source_attribution.csv \
            --text-column text \
            --label-column label \
            --group-column group_id \
            --strategies tfidf,e5 \
            --max-candidates 2 \
            --max-runtime-seconds 7200 \
            --expected-queries 2500 \
            --bootstrap-samples 500 \
            --min-gate-examples-per-class 5 \
            --out benchmark_runs/promptfoo-attribution \
            > benchmark_runs/promptfoo-attribution/cli_result.json
          code=$?
          echo "$code" > benchmark_runs/promptfoo-attribution/cli_exit_code.txt
          echo "CLI_EXIT_CODE=$code"
          exit 0
      - name: Assemble provenance and task interpretation
        if: always()
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          ACTIONS_RUN_ID: ${{ github.run_id }}
          ACTIONS_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("benchmark_runs/promptfoo")
          out = Path("benchmark_runs/promptfoo-attribution")
          out.mkdir(parents=True, exist_ok=True)
          prov = json.loads((root / "dataset_provenance.json").read_text(encoding="utf-8"))
          cli_path = out / "cli_result.json"
          try:
              cli = json.loads(cli_path.read_text(encoding="utf-8")) if cli_path.exists() else {}
          except Exception:
              cli = {}
          report_path = Path(cli.get("report_path", ""))
          report = json.loads(report_path.read_text(encoding="utf-8")) if report_path.is_file() else {}
          manifest = {
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "task": "classify which historical model family produced a response to a public political question",
              "not_a_quality_or_economic_ranking": True,
              "source_commit": os.environ["SOURCE_COMMIT"],
              "workflow_run_id": os.environ["ACTIONS_RUN_ID"],
              "workflow_run_attempt": os.environ["ACTIONS_RUN_ATTEMPT"],
              "dataset": "Promptfoo Political Questions / Political Bias Answers",
              "dataset_revision": prov.get("source_revision"),
              "dataset_source_sha256": prov.get("source_file_sha256"),
              "prepared_data_sha256": prov.get("outputs", {}).get("model_response_source_attribution.csv", {}).get("sha256"),
              "rows": prov.get("model_response_rows"),
              "groups": prov.get("unique_group_ids"),
              "classes": prov.get("model_response_label_counts"),
              "group_split_column": "group_id == question_id; all four responses to one source question stay together",
              "amorph_run_status": report.get("status"),
              "selected_strategy": report.get("selected_strategy"),
              "selection_objective": report.get("selection_objective"),
              "validation_metrics": report.get("validation_metrics_all_candidates", report.get("validation_metrics")),
              "proofgate": report.get("proofgate"),
              "task_requirements": report.get("task_requirements"),
              "business_requirements_passed": report.get("business_requirements_passed"),
              "tco_claim": "none; this task labels source model family and does not evaluate correctness or utility",
              "limitations": [
                  "Data contains 2025-era responses from GPT-4.1, Claude Opus 4, Gemini 2.5 Pro and Grok 4, not current releases.",
                  "Exact grouping prevents responses to the same question from crossing splits; semantic near-duplicates across different questions are not proven absent.",
                  "Near-duplicate audit may be skipped above the configured row cap.",
                  "No hosted model API calls were made during this AMORPH run.",
                  "Official source attribution is not answer correctness, safety, usefulness or business quality.",
              ],
          }
          manifest_path = out / "public_task_manifest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False, default=str) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("# Promptfoo grouped attribution benchmark\n\n")
              f.write(f"- Status: {manifest['amorph_run_status']}\n")
              f.write(f"- Source commit: {manifest['source_commit']}\n")
              f.write(f"- Dataset revision: {manifest['dataset_revision']}\n")
              f.write(f"- Rows / groups: {manifest['rows']} / {manifest['groups']}\n")
              f.write(f"- Selected strategy: {manifest['selected_strategy']}\n")
              f.write("- Task means model-source attribution only, not model quality/cost.\n")
          PY
      - name: Upload grouped-run report and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amorph-promptfoo-attribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark_runs/promptfoo-attribution/cli_result.json
            benchmark_runs/promptfoo-attribution/cli_exit_code.txt
            benchmark_runs/promptfoo-attribution/public_task_manifest.json
            benchmark_runs/promptfoo-attribution/**/report.json
            benchmark_runs/promptfoo-attribution/**/manifest.json
            benchmark_runs/promptfoo-attribution/**/replay.json
            benchmark_runs/promptfoo-attribution/**/data_report.json
            benchmark_runs/promptfoo-attribution/**/proofgate/**
            benchmark_runs/promptfoo-attribution/**/selected/**
          if-no-files-found: warn
          retention-days: 30
      - name: Propagate AMORPH benchmark exit code
        if: always()
        run: |
          code=$(cat benchmark_runs/promptfoo-attribution/cli_exit_code.txt 2>/dev/null || echo 99)
          if [ "$code" -ne 0 ]; then
            echo "AMORPH benchmark did not return success; exit code=$code"
            exit "$code"
          fi
