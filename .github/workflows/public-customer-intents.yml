name: Public customer-intent benchmark experiments

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: public-customer-intents-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: ${{ matrix.dataset }} public intent benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        dataset: [banking77, clinc150]
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      BENCHMARK_DATASET: ${{ matrix.dataset }}

    steps:
      - name: Checkout pull-request revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install AMORPH and public dataset readers
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[embeddings,test]"
          python -m pip install datasets huggingface_hub

      - name: Test public-data hygiene helpers
        run: python -m pytest tests/test_public_customer_intent_benchmark.py

      - name: Run AMORPH selector, Proof Gate, and report-only official test
        run: python scripts/benchmark_public_customer_intents.py --dataset "$BENCHMARK_DATASET" --output-dir "$RUNNER_TEMP/public-intent-evidence/$BENCHMARK_DATASET" --max-runtime-seconds 4800 --bootstrap-samples 500

      - name: Upload provenance, reports, models and SHA-256 inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amorph-public-intents-${{ matrix.dataset }}-${{ github.run_id }}
          path: ${{ runner.temp }}/public-intent-evidence/${{ matrix.dataset }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish benchmark locator to shared Issue #1
        if: always()
        uses: actions/github-script@v7
        env:
          BENCHMARK_DATASET: ${{ matrix.dataset }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const dataset = process.env.BENCHMARK_DATASET;
            const runUrl = context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + runId;
            let conclusion = "unknown";
            let artifact = null;
            try {
              const response = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
              conclusion = response.data.conclusion || response.data.status;
            } catch (error) {
              core.warning("Could not read run status: " + error.message);
            }
            try {
              const response = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: runId });
              const expectedName = "amorph-public-intents-" + dataset + "-" + runId;
              artifact = response.data.artifacts.find(item => item.name === expectedName) || null;
            } catch (error) {
              core.warning("Could not read artifacts: " + error.message);
            }
            const lines = [
              "[GPT] Public customer-intent benchmark",
              "- Dataset: " + dataset,
              "- Workflow revision: " + context.sha,
              "- Run: " + runUrl,
              "- Status at locator step: " + conclusion,
              artifact ? "- Artifact ID: " + artifact.id : "- Artifact ID: not visible yet",
              artifact && artifact.digest ? "- GitHub artifact digest: " + artifact.digest : "",
              "- Only official training data is used for AMORPH fitting; official test is report-only.",
              "- No public source group ID is available; this does not prove group-disjoint generalization.",
              "- Training data is capped per class so the near-duplicate audit remains executable.",
              "- This is external public-benchmark evidence, not validation on the owner's metal-products domain."
            ].filter(Boolean);
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 1,
              body: lines.join("\n")
            });
