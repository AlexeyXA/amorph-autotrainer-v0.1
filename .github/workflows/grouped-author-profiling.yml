name: Grouped Russian author-profiling benchmark

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: grouped-author-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  grouped-author-profile:
    name: AMORPH grouped age-imitation benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout PR revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install AMORPH and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[embeddings,test]"
          python -m pip install huggingface_hub

      - name: Test grouped-data hygiene
        run: python -m pytest tests/test_grouped_author_profiling_benchmark.py

      - name: Download only official train JSONL and execute the full AMORPH pipeline
        run: |
          python scripts/benchmark_grouped_author_profiling_ru.py \
            --output-dir "$RUNNER_TEMP/grouped-author-profiling-evidence" \
            --dataset-revision main \
            --max-runtime-seconds 4800 \
            --bootstrap-samples 500

      - name: Upload manifest, run report, selected model and artifact inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amorph-grouped-author-profile-${{ github.run_id }}
          path: ${{ runner.temp }}/grouped-author-profiling-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish run locator to shared Issue #1
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${runId}`;
            let conclusion = "unknown";
            let artifact = null;
            try {
              const response = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
              conclusion = response.data.conclusion || response.data.status;
            } catch (error) {
              core.warning(`Could not read run status: ${error.message}`);
            }
            try {
              const response = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: runId });
              artifact = response.data.artifacts.find(item => item.name === `amorph-grouped-author-profile-${runId}`) || null;
            } catch (error) {
              core.warning(`Could not read artifacts: ${error.message}`);
            }
            const lines = [
              "[GPT] Grouped author-profiling Actions run",
              `- Workflow commit: ${context.sha}`,
              `- Run: ${runUrl}`,
              `- Status at locator step: ${conclusion}`,
              `- Artifact name: amorph-grouped-author-profile-${runId}`,
              artifact ? `- Artifact ID: ${artifact.id}` : "- Artifact ID: not visible yet",
              artifact?.digest ? `- GitHub artifact digest: ${artifact.digest}` : "",
              "- Dataset: sagteam/author_profiling, task age_imitation, official train split only.",
              "- Actual group column: anonymized author_id; one author must remain in one internal split.",
              "- No raw source JSONL or cleaned CSV should be present in the artifact.",
              "- Public data only; this does not close the owner's private-domain readiness item."
            ].filter(Boolean);
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 1,
              body: lines.join("\n")
            });
