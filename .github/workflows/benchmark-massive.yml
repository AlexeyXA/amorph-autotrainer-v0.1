name: MASSIVE ru-RU benchmark

on:
  push:
    branches: [main]
    paths:
      - "scripts/benchmark_massive_ru.py"
      - "amorph_autotrainer/**"
      - ".github/workflows/benchmark-massive.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/benchmark-massive.yml"

permissions:
  contents: read

jobs:
  massive-benchmark:
    if: github.event_name != 'pull_request' || github.head_ref == 'experiment/e5-c01-balanced-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout pinned source revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          # Hosted GitHub runners use CPU for this job. Install the CPU wheel first
          # so the optional E5 stack does not pull the much larger CUDA dependency set.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0"
          python -m pip install -e ".[test,embeddings]" pandas pyarrow huggingface_hub
      - name: Record start time
        id: clock
        run: |
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "started_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Run MASSIVE ru-RU benchmark (TF-IDF and E5)
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # This protected experiment branch is the controlled E5 C=0.1/balanced variant.
            python scripts/benchmark_massive_ru.py \
              --with-e5 \
              --output-dir benchmark_runs/massive_ru_e5 \
              --max-runtime-seconds 7200 \
              --e5-classifier-c 0.1 \
              --e5-class-weight balanced
          else
            python scripts/benchmark_massive_ru.py \
              --with-e5 \
              --output-dir benchmark_runs/massive_ru_e5 \
              --max-runtime-seconds 7200 \
              --e5-classifier-c 1.0 \
              --e5-class-weight none
          fi
      - name: Record execution manifest and summary
        if: always()
        env:
          BENCHMARK_STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
          BENCHMARK_STARTED_UTC: ${{ steps.clock.outputs.started_utc }}
          SOURCE_COMMIT: ${{ github.sha }}
          ACTIONS_RUN_ID: ${{ github.run_id }}
          ACTIONS_RUN_ATTEMPT: ${{ github.run_attempt }}
          E5_CLASSIFIER_C: ${{ github.event_name == 'pull_request' && '0.1' || '1.0' }}
          E5_CLASS_WEIGHT: ${{ github.event_name == 'pull_request' && 'balanced' || 'none' }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path("benchmark_runs/massive_ru_e5")
          out.mkdir(parents=True, exist_ok=True)
          started_raw = os.environ.get("BENCHMARK_STARTED_EPOCH", "")
          started = int(started_raw) if started_raw else int(time.time())
          ended = int(time.time())
          inventory = []
          for path in sorted(out.rglob("*")):
              if not path.is_file() or path.name == "execution_manifest.json":
                  continue
              if "hf_cache" in path.parts:
                  continue
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              inventory.append({
                  "path": str(path),
                  "size_bytes": path.stat().st_size,
                  "sha256": digest.hexdigest(),
              })
          provenance_path = out / "dataset_provenance.json"
          result_path = out / "benchmark_result.json"
          provenance = json.loads(provenance_path.read_text(encoding="utf-8")) if provenance_path.is_file() else {}
          result = json.loads(result_path.read_text(encoding="utf-8")) if result_path.is_file() else {}
          manifest = {
              "status": "result_written" if result_path.is_file() else "incomplete_or_failed",
              "source_commit": os.environ.get("SOURCE_COMMIT"),
              "workflow_run_id": os.environ.get("ACTIONS_RUN_ID"),
              "workflow_run_attempt": os.environ.get("ACTIONS_RUN_ATTEMPT"),
              "command": (
                  "python scripts/benchmark_massive_ru.py --with-e5 "
                  "--output-dir benchmark_runs/massive_ru_e5 --max-runtime-seconds 7200 "
                  f"--e5-classifier-c {os.environ.get('E5_CLASSIFIER_C', '1.0')} "
                  f"--e5-class-weight {os.environ.get('E5_CLASS_WEIGHT', 'none')}"
              ),
              "e5_classifier_config": {
                  "C": float(os.environ.get("E5_CLASSIFIER_C", "1.0")),
                  "class_weight": (
                      None if os.environ.get("E5_CLASS_WEIGHT", "none") == "none"
                      else os.environ.get("E5_CLASS_WEIGHT")
                  ),
              },
              "started_at_utc": os.environ.get("BENCHMARK_STARTED_UTC"),
              "finished_at_utc": datetime.now(timezone.utc).isoformat(),
              "elapsed_seconds": max(0, ended - started),
              "python_version": platform.python_version(),
              "dataset_id": provenance.get("dataset_id", "AmazonScience/massive"),
              "dataset_revision": provenance.get("dataset_revision", "c4aa61e89895160619e18a94de72f19b99e72ca2"),
              "selected_strategy": result.get("selected_strategy"),
              "external_test_metrics_by_strategy": result.get("external_test_metrics_by_strategy"),
              "file_inventory_sha256": inventory,
          }
          (out / "execution_manifest.json").write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("# AMORPH MASSIVE ru-RU benchmark\n\n")
              handle.write("- Status: " + manifest["status"] + "\n")
              handle.write("- Source commit: " + str(manifest["source_commit"]) + "\n")
              handle.write("- Dataset revision: " + str(manifest["dataset_revision"]) + "\n")
              handle.write("- Elapsed seconds: " + str(manifest["elapsed_seconds"]) + "\n")
              handle.write("- E5 classifier config: " + json.dumps(manifest["e5_classifier_config"]) + "\n")
              if result:
                  handle.write("- Selected strategy: " + str(result.get("selected_strategy")) + "\n")
                  handle.write("\nOfficial-test metrics (report-only; after internal selection):\n\n")
                  handle.write(json.dumps(result.get("external_test_metrics_by_strategy", {}), indent=2, ensure_ascii=False))
                  handle.write("\n")
              else:
                  handle.write("\nNo complete benchmark_result.json was produced. Inspect the failed step logs.\n")
          PY
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amorph-massive-ru-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark_runs/massive_ru_e5/dataset_provenance.json
            benchmark_runs/massive_ru_e5/benchmark_result.json
            benchmark_runs/massive_ru_e5/execution_manifest.json
            benchmark_runs/massive_ru_e5/data/*.csv
            benchmark_runs/massive_ru_e5/runs/**
          if-no-files-found: warn
          retention-days: 30
