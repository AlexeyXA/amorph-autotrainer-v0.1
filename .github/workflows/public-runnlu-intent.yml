name: Public RuNLU intent benchmark

on:
  push:
    branches:
      - experiments/public-runnlu-intent-20261023
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: public-runnlu-intent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-runnlu:
    name: Public Russian intent dataset run
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout pinned project revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install AMORPH, test and public-data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[embeddings,test]"
          python -m pip install pandas pyarrow huggingface_hub
      - name: Verify public dataset preparation guards
        run: python -m pytest tests/test_public_runnlu_benchmark.py
      - name: Download pinned RuNLU train split and run AMORPH
        run: |
          python scripts/benchmark_public_runnlu_intent_ru.py \
            --output-dir "$RUNNER_TEMP/public-runnlu-evidence" \
            --max-runtime-seconds 4800 \
            --bootstrap-samples 500
      - name: Upload report, manifest, model bundle and SHA-256 inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amorph-public-runnlu-${{ github.run_id }}
          path: ${{ runner.temp }}/public-runnlu-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish run and artifact locator to the shared Issue #1
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${runId}`;
            let runStatus = "unknown";
            let artifact = null;
            try {
              const runResponse = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
              runStatus = runResponse.data.conclusion || runResponse.data.status;
            } catch (error) {
              core.warning(`Could not read workflow-run status: ${error.message}`);
            }
            try {
              const artifactResponse = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: runId });
              artifact = artifactResponse.data.artifacts.find(item => item.name === `amorph-public-runnlu-${runId}`) || null;
            } catch (error) {
              core.warning(`Could not read uploaded artifacts: ${error.message}`);
            }
            const lines = [
              "[GPT] Public RuNLU Actions run locator",
              `- Commit: ${context.sha}`,
              `- Run: ${runUrl}`,
              `- Status at locator step: ${runStatus}`,
              `- Artifact name: amorph-public-runnlu-${runId}`,
              artifact ? `- Artifact ID: ${artifact.id}` : "- Artifact ID: not visible to API at locator step",
              artifact?.digest ? `- GitHub artifact digest: ${artifact.digest}` : "",
              "- Dataset source is pinned; only official train split is downloaded. No raw dataset CSV is included in the artifact.",
              "- This is public-dataset integration evidence, not owner-private-domain acceptance."
            ].filter(Boolean);
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 1,
              body: lines.join("\\n")
            });
